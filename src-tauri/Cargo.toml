# One workspace: the app, the conversion engine, the CLI and zero_fs.
[workspace]
members = [".", "crates/zero_fs", "crates/zeroconverter-core", "crates/zeroconverter-cli"]

[package]
name = "zero-converter"
version = "0.1.2"
description = "Offline batch asset converter for game developers and technical artists"
authors = ["ZeroFoundry"]
license = "MIT"
publish = false
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["mp3"]
# MP3 writing through LAME (LGPL). `--no-default-features` builds without it.
mp3 = ["zeroconverter-core/mp3"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# Rename-to-convert: originals go to the Recycle Bin, not to oblivion.
trash = "5"
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
image = { version = "0.25", features = ["webp", "png", "jpeg", "qoi"] }
zero_fs = { path = "crates/zero_fs" }
zeroconverter-core = { path = "crates/zeroconverter-core", default-features = false, features = ["ffmpeg-download"] }
dunce = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_Media_Audio", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Globalization"] }
# COM interfaces for Explorer's Desktop view (rename_convert/desktop.rs).
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }


[dev-dependencies]
tempfile = "3"

# Optimize dependencies even in dev mode to speed up image processing
[profile.dev.package."*"]
opt-level = 3
